# Keeps the Brevo API key active.
#
# Brevo deactivates any API key that hasn't made a successful call in 90 days,
# and there's no setting to turn that off. Thaali's key is only used when
# someone submits the contact form or a report, so in quiet months it can go
# 90 days untouched. This makes one harmless read-only call (GET /v3/account)
# on the 1st of every month, which resets Brevo's inactivity timer. It sends
# no email.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions →
#        New repository secret → Name: BREVO_API_KEY, Value: same key as in
#        Cloudflare Pages.

name: Brevo key keep-alive

on:
  schedule:
    - cron: '17 14 1 * *'   # 1st of each month, 14:17 UTC (~9am CT)
  workflow_dispatch: {}      # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Brevo account endpoint
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "BREVO_API_KEY secret is empty or missing"; exit 1
          fi
          echo "Key length: ${#BREVO_API_KEY}, prefix: ${BREVO_API_KEY:0:8}"
          code=$(curl -s -o resp.json -w '%{http_code}' \
            -H "api-key: $BREVO_API_KEY" \
            -H "accept: application/json" \
            https://api.brevo.com/v3/account)
          echo "Brevo responded: $code"
          if [ "$code" != "200" ]; then
            # Only Brevo's error code/message — never the account body,
            # since logs on a public repo are public.
            jq -r '"Brevo says: \(.code // "?") — \(.message // "?")"' resp.json || true
            exit 1
          fi
